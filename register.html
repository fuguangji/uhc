<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>立即報名 - 2027 Winter UHC</title>
    <link rel="icon" type="image/png" href="./assets/raceLogo.png" />
    <link rel="shortcut icon" href="./assets/raceLogo.png" />
    <style>
      :root {
        --color-primary: #046276;
      }
      .card {
        position: relative;
        overflow: hidden;
        width: 660px;
        height: 440px;
        background: #ffffff;
        border-radius: 32px;
      }
      .card-bg {
        position: absolute;
        z-index: 2;
        top: 0;
        bottom: 0;
        left: 0;
        width: 860px;
        height: 440px;
        rotate: -45deg;
      }

      .logo {
        position: absolute;
        z-index: 2;
        transition: 0.3s;
        opacity: 0;
      }
      .logo-1 {
        translate: -180px 0;
        left: 20px;
      }
      .logo-2 {
        translate: 180px 0;
        right: 20px;
      }
      .form {
        position: absolute;
        z-index: 3;
        top: 0;
        bottom: 0;
        left: 0;
        width: 50%;
        display: grid;
        place-items: center;
      }
      .form h2 {
        text-align: center;
        font-weight: 500;
      }
      .form form {
        display: grid;
        gap: 12px;
        opacity: 0;
        transition: 0.3s;
      }
      .form a {
        display: inline-flex;
        flex-direction: column;
        gap: 8px;
        color: #a7a7ad;
        cursor: pointer;
        font-size: 14px;
        text-align: center;
      }
      .form p {
        text-align: center;
        color: #a7a7ad;
        font-size: 14px;
        margin: 8px 0;
      }
      .form a em {
        color: var(--color-primary);
        display:block;
        font-style:normal;
        font-size: 15px;
      }
    </style>
    <script >
      const signinForm = document.querySelector(".form.signin");
      const signupForm = document.querySelector(".form.signup");
      const cardBg1 = document.querySelector(".card-bg-1");
      const cardBg2 = document.querySelector(".card-bg-2");

      const tooggleView = () => {
        const signinActive = signinForm.classList.contains("active");
        signinForm.classList.toggle("active", !signinActive);
        signupForm.classList.toggle("active", signinActive);
        [cardBg1, cardBg2].forEach((el) => 
          el.classList.toggle("signin", signinActive)
        );
        [cardBg1, cardBg2].forEach((el) => 
          el.classList.toggle("signup", !signinActive)
        );
      };
    </script>
  </head>
  <body>
    <div class="card">
      <div class="card-bg-1"></div>
      <div class="card-bg-2"></div>
      <img src="./assets/raceLogo.png" alt="Logo" class="logo logo-1" />
      <img src="./assets/raceLogo.png" alt="Logo" class="logo logo-2" />
      <div class="form signup active">
        <form>
          <h2>註冊</h2>
          <p>請填寫以下資訊以完成報名。</p>
          <input type="text" placeholder="玩家名稱" />
          <input type="email" placeholder="電子郵件" required />
          <button>註冊</button>
          <em>登入</em>
        </form>
      </div>
    </div>
  </body>
</html>
