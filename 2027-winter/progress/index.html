<!DOCTYPE html>
<html lang="zh-TW" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2027 冬季 UHC 錦標賽 | 開發進度</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&family=Syncopate:wght@700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = { theme: { extend: { fontFamily: { sans: ['"Noto Sans TC"', 'sans-serif'], display: ['"Syncopate"', 'sans-serif'] }, colors: { polar: { 50: '#f0f7ff', 100: '#e0effe', 200: '#bae0fd', 300: '#7cc8fc', 400: '#38bdf8', 500: '#0ea5e9', 800: '#0369a1', 900: '#0c4a6e', 950: '#082f49' } } } } }
    </script>
    <style>
        :root { --light-glass: rgba(255, 255, 255, 0.75); --light-border: rgba(255, 255, 255, 0.5); --light-shadow: 0 12px 40px -10px rgba(14, 165, 233, 0.15); --blur-effect: blur(16px); }
        body { background-color: #f0f7ff; color: #0c4a6e; font-family: 'Noto Sans TC', sans-serif; }
        .bg-overlay { position: fixed; inset: 0; z-index: -2; background: linear-gradient(to bottom, rgba(240, 247, 255, 0.5) 0%, rgba(224, 239, 254, 0.9) 100%); backdrop-filter: blur(8px); }
        .glass-card { background: var(--light-glass); backdrop-filter: var(--blur-effect); border: 1px solid var(--light-border); box-shadow: var(--light-shadow); border-radius: 24px; }
        .text-gradient-polar { background: linear-gradient(135deg, #082f49 0%, #0284c7 60%, #0ea5e9 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    </style>
</head>
<body class="antialiased">
    <div class="bg-overlay"></div>

    <header id="main-header" class="fixed w-full z-50 top-0 transition-all duration-500 py-3 px-6">
        <div class="max-w-7xl mx-auto px-6 py-3 flex justify-between items-center glass-card shadow-sm border-white/50">
            <a href="index.html" class="flex items-center gap-3 text-polar-950 font-bold tracking-widest text-lg">
                <i data-lucide="snowflake" class="text-polar-500"></i><span class="font-display tracking-wider text-gradient-polar">WINTER UHC</span>
            </a>
            <nav class="hidden md:flex items-center gap-8 text-sm font-medium tracking-wider text-polar-900">
                <a href="../" class="hover:text-polar-500 transition-colors">首頁</a>
                <a href="../encyclopedia" class="hover:text-polar-500 transition-colors">系統百科</a>
                <a href="../database" class="text-polar-500 font-bold">礦物裝備</a>
                <a href="../rules" class="hover:text-polar-500 transition-colors">賽事規則</a>
                <a href="../progress" class="hover:text-polar-500 transition-colors">開發進度</a>
                <a href="../register" class="px-5 py-2.5 bg-polar-900 text-white rounded-xl shadow-lg hover:bg-polar-800 transition-all">立即報名</a>
            </nav>
        </div>
    </header>

    <main class="pt-32 pb-24 px-6 max-w-5xl mx-auto min-h-screen">
        <div class="text-center mb-16">
            <span class="text-polar-600 font-mono text-sm uppercase tracking-widest">Changelog</span>
            <h1 class="text-3xl md:text-4xl font-bold text-polar-950 mt-2 mb-3 tracking-wider">開發進度</h1>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <div class="glass-card p-8">
                <h3 class="text-xl font-bold text-polar-950 mb-6 flex items-center gap-2"><i data-lucide="bar-chart-2" class="text-polar-500"></i> 功能模組進度</h3>
                <div class="space-y-6">
                    <div>
                        <div class="flex justify-between text-base mb-2 font-bold text-polar-900"><span>核心體溫與氣候</span><span class="text-polar-600 font-mono text-sm">95%</span></div>
                        <div class="w-full h-3 bg-polar-100 rounded-full overflow-hidden shadow-inner"><div class="h-full bg-gradient-to-r from-polar-400 to-polar-600 rounded-full" style="width: 95%"></div></div>
                    </div>
                    <div>
                        <div class="flex justify-between text-base mb-2 font-bold text-polar-900"><span>地圖與場景建置</span><span class="text-polar-600 font-mono text-sm">90%</span></div>
                        <div class="w-full h-3 bg-polar-100 rounded-full overflow-hidden shadow-inner"><div class="h-full bg-gradient-to-r from-polar-400 to-polar-600 rounded-full" style="width: 90%"></div></div>
                    </div>
                    <div>
                        <div class="flex justify-between text-base mb-2 font-bold text-polar-900"><span>礦物與裝備數值</span><span class="text-polar-600 font-mono text-sm">80%</span></div>
                        <div class="w-full h-3 bg-polar-100 rounded-full overflow-hidden shadow-inner"><div class="h-full bg-gradient-to-r from-polar-400 to-polar-600 rounded-full" style="width: 80%"></div></div>
                    </div>
                </div>
            </div>

            <div class="glass-card p-8">
                <h3 class="text-xl font-bold text-polar-950 mb-6 flex items-center gap-2"><i data-lucide="git-commit" class="text-polar-500"></i> 版本更新日誌</h3>
                <div class="space-y-6 border-l-2 border-polar-200 pl-4">
                    <div class="relative">
                        <div class="absolute -left-[21px] top-1.5 w-3 h-3 rounded-full bg-polar-500 border-2 border-white shadow-sm"></div>
                        <div class="flex items-center gap-3 mb-1.5"><span class="font-bold text-polar-950 text-base">v2.0.0</span><span class="text-sm font-mono text-polar-600">2026.07.24</span></div>
                        <p class="text-polar-700 text-base leading-relaxed">網站升級為標準多頁面架構，拆分為 6 個獨立 HTML 檔案。</p>
                    </div>
                    <div class="relative">
                        <div class="absolute -left-[21px] top-1.5 w-3 h-3 rounded-full bg-polar-500 border-2 border-white shadow-sm"></div>
                        <div class="flex items-center gap-3 mb-1.5"><span class="font-bold text-polar-950 text-base">v1.0.5</span><span class="text-sm font-mono text-polar-600">2026.07.23</span></div>
                        <p class="text-polar-700 text-base leading-relaxed">實裝背景攝影集自動輪播引擎與 3D 飄雪特效。</p>
                    </div>
                    <div class="relative">
                        <div class="absolute -left-[21px] top-1.5 w-3 h-3 rounded-full bg-polar-500 border-2 border-white shadow-sm"></div>
                        <div class="flex items-center gap-3 mb-1.5"><span class="font-bold text-polar-950 text-base">v1.0.0</span><span class="text-sm font-mono text-polar-600">2026.05.01</span></div>
                        <p class="text-polar-700 text-base leading-relaxed">官方網站立項與 SPA 初版佈局發布。</p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="border-t border-polar-200 bg-white/40 py-12 px-6">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-6"><div class="flex items-center gap-3 font-bold tracking-widest"><i data-lucide="snowflake" class="text-polar-500"></i><span class="font-display">WINTER UHC 2027</span></div><p class="text-sm text-polar-600">&copy; 2027 Winter UHC Championship. 非官方社群賽事。</p></div>
    </footer>
    <script>lucide.createIcons();</script>
</body>
</html>
